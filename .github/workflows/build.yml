name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget python3-dev python3-pip python3-setuptools python3-wheel \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev

      - name: Install west
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user west
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clean workspace
        run: |
          rm -rf .west zmk zephyr modules bootloader cirque-input-module build firmware

      - name: West init
        run: |
          west init -l config

      - name: West update
        run: |
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.9/zephyr-sdk-0.16.9_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.16.9_linux-x86_64_minimal.tar.xz
          ./zephyr-sdk-0.16.9/setup.sh -t arm-zephyr-eabi -h -c

      - name: Restore private password macros
        env:
          DULLBOY_MDP_DTSI: ${{ secrets.DULLBOY_MDP_DTSI }}
        run: |
          if [ -z "$DULLBOY_MDP_DTSI" ]; then
            echo "Missing DULLBOY_MDP_DTSI repository secret" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$DULLBOY_MDP_DTSI" > config/mdp.dtsi

      - name: Build firmware
        run: |
          west build \
            -s zmk/app \
            -b nice_nano@2.0.0 \
            -- \
            -DSHIELD=dullboy \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename firmware
        run: |
          mkdir -p firmware
          cp build/zephyr/zmk.uf2 firmware/dullboy.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dullboy-firmware
          path: firmware/dullboy.uf2
          if-no-files-found: error
