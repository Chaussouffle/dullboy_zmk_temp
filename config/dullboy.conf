# -------------------------
# USB optionnel
# -------------------------

CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y


# -------------------------
# BLE périphérique
# -------------------------

CONFIG_ZMK_BLE=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# -------------------------
# Identité + bonds
# -------------------------

CONFIG_BT_DEVICE_NAME="dullboy"
CONFIG_BT_SETTINGS=y
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# -------------------------
# Paramètres de connexion
# -------------------------

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# -------------------------
# Power
# -------------------------

CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_TIMEOUT=900000

# -------------------------
# nRF pin cleanup
# -------------------------

CONFIG_NFCT_PINS_AS_GPIOS=y

# -------------------------
# HID / media / pointing
# -------------------------

CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_INPUT_PINNACLE=y
CONFIG_I2C=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256


# -------------------------
# BATTERY
# -------------------------

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# -------------------------
# Logging — DEBUG ONLY
# Décommenter uniquement pour diagnostiquer.
# En prod : laissé désactivé (autonomie + moins de jitter trackpad,
# le mode immediate ajoute de la latence sur le chemin d'input).
# -------------------------

# CONFIG_LOG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_INPUT_LOG_LEVEL_DBG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
